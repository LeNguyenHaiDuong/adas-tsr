site_name: TSR for ADAS
site_description: Traffic Sign Recognition research and baseline documentation
docs_dir: .mkdocs_docs
site_dir: site
use_directory_urls: false

validation:
  links:
    not_found: ignore

theme:
  name: material
  language: vi
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search

nav:
  - Home: index.md
  - Troubleshooting: TROUBLESHOOTING.md
  - Research:
      - 0. Requirements Brief: research/0.requirements.md
      - 1. Narrative:
          - 1.01. Prototype to Production: research/1.narrative/01.prototype_to_production.md
      - 2. Knowledge Base:
          - 2.01. Automotive Standards, SOTIF, ODD: research/2.knowledge_base/01.automotive_standards.md
          - 2.02. Camera Hardware and IEEE 2020: research/2.knowledge_base/02.camera_hardware_ieee2020.md
          - 2.03. Safety Analysis, HAZOP, FTA: research/2.knowledge_base/03.safety_analysis_hazop_fta.md
      - 3. Implementation:
          - 3.01. Hybrid Pipeline Architecture: research/3.implementation/01.hybrid_pipeline_architecture.md
          - 3.02. State Manager and HMI: research/3.implementation/02.state_manager_and_hmi.md
          - 3.03. Edge Deployment and Benchmarks: research/3.implementation/03.edge_deployment_and_benchmarks.md
  - Videos: videos/README.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid.js
